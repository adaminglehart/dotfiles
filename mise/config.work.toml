[bootstrap.packages]
"brew:terraform-ls" = "latest"
"brew-cask:font-jetbrains-mono" = { version = "latest", os = "macos" }
"brew-cask:rectangle" = { version = "latest", os = "macos" }

[dotfiles]
"~/.codex/config.toml" = { source = "~/dev/dotfiles/private/.codex/config.work.toml", mode = "copy" }
"~/.config/fish/user_conf.d/stripe.fish" = "~/dev/dotfiles/profiles/work/.config/fish/user_conf.d/stripe.fish"
